    icon: GOLD_INGOT
    model-data: 0
    name: '&aCurrencia'
    lore:
      - '&7Click Izquierdo para subir'
      - '&7Click Derecho para bajar'
      - '&8-------------------------'
      - '&f%previous%'
      - '&8> &e%current%'
      - '&f%next%'
      - '&8-------------------------'
  mode:
    icon: HOPPER
    model-data: 0
    name: '&bModo de Lista'
    lore:
      - '&7Click para Alternar'
      - '&8-------------------------'
      - '%first%'
      - '%second%'
      - '&8-------------------------'
    options:
      selected: '&8> &e%option%'
      not-selected: '&f%option%'

