categories:
- id: building-blocks
  name: '&dBuilding Blocks'
  priority: 2
  model-data: 0
  icon: BRICKS
  description:
  - '&fBlocks used to make &ebeautiful &fbuildings!'
  matchers:
  - '%material% == "COARSE_DIRT"'
  - '%material% == "TERRACOTTA"'
  - '%material%.endsWith("_WOOL")'
  - '%material%.endsWith("_TERRACOTTA")'
  - '%material%.endsWith("_CONCRETE")'
  - '%material%.endsWith("_CONCRETE_POWDER")'
