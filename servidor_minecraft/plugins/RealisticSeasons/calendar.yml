enabled: true
american-date-format: false
calendar-is-real-life-days: false
sync-time-with-real-world: false
time-sync-offset: 0
time-sync-timezone: 'system'
time:
  format: '$hours$:$minutes$'
  12-hour-clock:
    enabled: false
    add-am-pm: false
week-days:
- Lunes
- Martes
- Miércoles
- Jueves
- Viernes
- Sábado
- Domingo
synced-worlds:
- none
worlds-without-events:
- Spawn

winter-start: Diciembre 21
spring-start: Marzo 20
summer-start: Junio 21
fall-start: Septiembre 22

months:
  Enero:
    days: 31
    day-length-in-min: 8
    night-length-in-min: 12
  Febrero:
    days: 28
    day-length-in-min: 9
    night-length-in-min: 11
